# 1-GPU Cosmos3 Nano Sim deployment (chunked causal rollout over a K/V cache).
# Model: nvidia/Cosmos3-Nano-Sim-Bimanual
# Shared by offline examples (--visual_gen_args) and trtllm-serve.
#
# The causal rollout reads finished frames from a paged K/V cache, which needs
# an attention backend that can attend over it: TRTLLM (trtllm-gen) or CUDNN.
# Chunk size, denoising schedule, history window and action layout come from
# the checkpoint. Warmup runs the largest shape the checkpoint serves and sizes
# the cache from the memory left; kv_cache_config.free_gpu_memory_fraction is
# the share of that memory the cache may take.
attention_config:
  backend: TRTLLM
parallel_config:
  cfg_size: 1
  ulysses_size: 1
kv_cache_config:
  free_gpu_memory_fraction: 0.9
# The chunk forward replays as CUDA graphs (one per chunk shape and pass).
cuda_graph_config:
  enable: true
